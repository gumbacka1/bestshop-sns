<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="common.css"><script src="engine.js"></script><script src="ui.js"></script><title>10. 상담 3안 비교</title></head><body><div class="wrap" id="app"></div>
<script>
let plans=load('c10',[[],[],[]]),names=load('c10n',['1안','2안','3안']),cur=0,card=load('c10card','신한카드');
function draw(){
  save('c10',plans);save('c10n',names);save('c10card',card);
  const rs=plans.map(p=>calc(p,{card})); const best=rs.reduce((b,r,i)=>r.count&&(b<0||r.final+r.subTotal<rs[b].final+rs[b].subTotal)?i:b,-1);
  app.innerHTML=topBar('10. 상담 3안 비교','매니저용')+'<div class="box">'+[0,1,2].map(i=>'<span class="chip '+(i===cur?'on':'')+'" data-p="'+i+'">'+names[i]+' ('+plans[i].length+')</span>').join('')+
  '<button class="chip" id="dup">지금 안 복사 →</button><input class="n" id="pn" style="margin-top:6px" value="'+names[cur]+'" placeholder="안 이름 (예: 구독 위주)">'+pickerHTML('q')+'<div id="cart">'+cartHTML(plans[cur])+'</div>'+cardSelect('card',card)+'</div>'+
  '<div class="box"><h2>3안 비교</h2><table><tr><th></th>'+names.map((n,i)=>'<th'+(i===best?' class="red"':'')+'>'+n+'</th>').join('')+'</tr>'+
  [['품목 수',r=>r.count+'개'],['일시불 최종',r=>won(r.final)],['구독 월',r=>won(r.subMonth)],['6년 총부담',r=>won(r.final+r.subTotal)],['캐시백',r=>won(r.cash)],['포인트',r=>(r.point+r.subPoint).toLocaleString()+'P'],['사은품',r=>r.gift?man(r.gift):'-']].map(([k,f])=>'<tr><td>'+k+'</td>'+rs.map(r=>'<td>'+(r.count?f(r):'-')+'</td>').join('')+'</tr>').join('')+'</table>'+
  (best>=0?'<div class="note">총부담이 가장 적은 안: <b>'+names[best]+'</b> (구독은 케어 포함이라 금액만으로 비교하지 마세요)</div>':'')+'</div>'+footNote();
  bindPicker('q',m=>{addToCart(plans[cur],m);draw();});bindCart(document.getElementById('cart'),plans[cur],draw);document.getElementById('card').onchange=e=>{card=e.target.value;draw();};
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{cur=+b.dataset.p;draw();});
  pn.onchange=e=>{names[cur]=e.target.value||names[cur];draw();};
  dup.onclick=()=>{const n=(cur+1)%3;plans[n]=JSON.parse(JSON.stringify(plans[cur]));cur=n;draw();};
}
loadModels().then(draw);
</script></body></html>
