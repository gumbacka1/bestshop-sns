<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="common.css"><script src="engine.js"></script><script src="ui.js"></script><title>1. 닷컴 계산기 그대로</title></head><body><div class="wrap" id="app"></div>
<script>
let cart = load('c1', []), card = load('c1card', '신한카드'), pov = '';
function draw(){
  const r = calc(cart, {card, pointOverride: pov});
  save('c1', cart); save('c1card', card);
  app.innerHTML = topBar('1. 닷컴 계산기 그대로', '<b>'+r.count+'개 · '+won(r.pay)+'</b>') +
  '<div class="box">'+pickerHTML('q')+'<button class="chip" id="smp">캡처 예시 담기</button><div id="cart">'+cartHTML(cart,{check:true})+'</div></div>'+
  '<div class="box"><div class="row"><h2>할인 결제가</h2><span class="big red">'+won(r.pay)+'</span></div><div class="line"></div>'+
  '<div class="row"><span>판매가</span><span>'+won(r.list)+'</span></div><div class="row sub"><span>ㄴ 회원 할인</span><span>-'+won(r.member)+'</span></div><div class="row sub"><span>ㄴ 쿠폰 할인</span><span>-'+won(r.coupon)+'</span></div></div>'+
  '<div class="box"><div class="row"><h2>구매 후 예상 혜택</h2><span class="big">'+won(r.benefit)+'</span></div>'+cardSelect('card',card)+
  '<div class="row" style="margin-top:8px"><span>제품별 캐시백 (최대)</span><span>'+won(r.prodCash)+'</span></div><div class="row"><span>다품목 캐시백</span><span>'+won(r.multi+r.smallCash)+'</span></div><div class="row sub"><span>ㄴ 기본+추가 : '+r.large+'품목</span><span>'+won(r.multi)+'</span></div><div class="row sub"><span>ㄴ 소형가전 : '+r.small+'품목</span><span>'+won(r.smallCash)+'</span></div>'+
  '<div class="row"><span>결제일 할인 7% (최대)</span><span>'+won(r.payDc)+'</span></div><div class="row"><span>멤버십 포인트 적립</span><span>'+r.point.toLocaleString()+'P</span></div>'+
  '<div class="row sub"><span>포인트 직접 입력</span><input class="mini" id="pov" inputmode="numeric" value="'+pov+'" placeholder="자동"></div>'+
  (r.subCount?'<div class="line"></div><div class="row"><span>구독 '+r.subCount+'개 월 합계</span><b>'+won(r.subMonth)+'</b></div><div class="row sub"><span>ㄴ 구독 포인트(첫구독+품목)</span><span>'+r.subPoint.toLocaleString()+'P</span></div>':'')+
  (r.notes.length?'<div class="note">'+r.notes.join('<br>')+'</div>':'')+'</div>'+
  '<div class="box"><div class="row"><h2>최종 혜택 적용 금액</h2><span class="big red">'+won(r.final)+'</span></div>'+(r.gift?'<div class="muted">+ 금액대 사은품 '+man(r.gift)+' 상당</div>':'')+'</div>'+footNote();
  bindPicker('q', m=>{addToCart(cart,m); draw();}); bindCart(document.getElementById('cart'), cart, draw);
  document.getElementById('card').onchange=e=>{card=e.target.value; draw();};
  document.getElementById('pov').onchange=e=>{pov=e.target.value.replace(/\D/g,''); draw();};
  document.getElementById('smp').onclick=()=>{cart=JSON.parse(JSON.stringify(SAMPLE)); draw();};
}
loadModels().then(draw);
</script></body></html>
