<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>관리자 · SNS 대시보드</title>
<style>
body{font-family:"LG스마트체2.0 Regular","LG스마트체","Pretendard","Malgun Gothic",sans-serif;margin:0;padding:20px;color:#1f1f1f}
.w{max-width:1000px;margin:0 auto} h1{font-size:24px;margin:0 0 4px} .sub{color:#6b6b6b;font-size:13px;margin:0 0 18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:18px}
.c{background:#f7f7f5;border:1px solid #e2e2df;border-radius:8px;padding:12px}.c b{display:block;font-size:24px;margin-top:4px}.c small{color:#6b6b6b}
.ok{color:#1e8e3e}.bad{color:#d93025}.warn{color:#b26a00}
h2{font-size:16px;margin:22px 0 8px} table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:#EDEDED;padding:6px 8px;border-bottom:1px solid #ddd;white-space:nowrap} td{padding:5px 8px;border-bottom:1px solid #eee;white-space:nowrap}
a{color:#2E6BE6} ul{margin:4px 0 0 18px;padding:0;font-size:13.5px;line-height:1.8}
</style></head><body><div class="w">
<h1>🔧 관리자 화면</h1><p class="sub">이 주소는 회원님만 알고 계세요. 숫자를 바꾸는 기능은 없고, 수집 상태만 보여 줘요. <a href="./">← 대시보드로</a></p>
<div class="cards" id="cards"></div>
<h2>인스타 키 만료</h2><div id="key"></div>
<h2>바로가기</h2>
<ul>
<li><a href="https://docs.google.com/document/d/1GBlTDaV_ppgR7erfLkur217cwrQNKt9PCGFjp7Ro5gE/edit" target="_blank">ig_key 문서 (인스타 수집 키 · 공유 금지)</a></li>
<li><a href="https://drive.google.com/drive/folders/1Ao1xk0mEtHTCQc-4KbkF-GeD28MHIkB9" target="_blank">드라이브 폴더: 03_SNS 대시보드 (직접 수집)</a></li>
<li><a href="https://claude.ai/artifact/7E3B52MEDU3BPbh3tgFKbh" target="_blank">Claude 안의 대시보드 원본</a></li>
<li><a href="https://developers.facebook.com/apps/1839145630616460/" target="_blank">메타 개발자 앱 (경북 SNS 대시보드)</a></li>
</ul>
<h2>오늘 인스타를 아직 못 받은 지점 <span id="misscnt" class="sub"></span></h2>
<table><thead><tr><th>담당</th><th>지점</th><th>인스타</th><th>마지막 수집일</th><th>카톡</th><th>상태</th></tr></thead><tbody id="miss"></tbody></table>
<h2>담당별 수집 현황</h2>
<table><thead><tr><th>담당</th><th>지점</th><th>인스타 오늘 수집</th><th>카톡 값 있음</th></tr></thead><tbody id="teams"></tbody></table>
</div>
<script>
const KEY_END=new Date('2027-02-18T02:16:00+09:00');
(async()=>{
 const L=await fetch('data/latest.json?v='+Date.now()).then(r=>r.json());
 const ups=L.map(r=>r.updated).filter(Boolean).sort(); const last=ups[ups.length-1]||'';
 const today=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
 const igToday=L.filter(r=>r.igDate===today).length, hasIgDate=L.some(r=>r.igDate);
 const kk=L.filter(r=>r.kakao!==null&&r.kakao!==undefined).length;
 const part=L.filter(r=>r.status&&r.status!=='ok').length;
 const card=(t,v,cls,s)=>`<div class="c"><small>${t}</small><b class="${cls||''}">${v}</b><small>${s||''}</small></div>`;
 document.getElementById('cards').innerHTML=
  card('마지막 갱신',last.slice(5)||'—','', last.slice(0,10)===today?'오늘':'<span class="bad">오늘 갱신 없음</span>')+
  card('인스타 오늘 수집',hasIgDate?igToday+' / '+L.length:'—',igToday===L.length?'ok':(hasIgDate?'warn':''),hasIgDate?'오전 3번에 나눠 받아요':'직접 수집 전(경인담당 값)')+
  card('카톡 값 있음',kk+' / '+L.length,kk===L.length?'ok':'warn')+
  card('일부 실패 지점',part,part?'warn':'ok');
 const days=Math.ceil((KEY_END-Date.now())/864e5);
 document.getElementById('key').innerHTML=`<p style="font-size:14px">데이터 접근 권한 만료: <b>2027-02-18(목) 새벽 2시쯤</b> · <b class="${days<=14?'bad':(days<=30?'warn':'ok')}">${days}일 남음</b><br><span class="sub">1주 전(2/11)·2일 전(2/16)에 휴대폰 알림이 와요. 알림이 오면 Claude에게 "인스타 키 재승인하자"라고 하면 돼요.</span></p>`;
 const miss=L.filter(r=>hasIgDate&&r.igDate!==today);
 document.getElementById('misscnt').textContent=hasIgDate?miss.length+'개':'(직접 수집 시작 후 표시)';
 document.getElementById('miss').innerHTML=miss.map(r=>`<tr><td>${r.team}</td><td>${r.store}</td><td><a href="https://www.instagram.com/${r.handle}/" target="_blank">${r.handle}</a></td><td>${r.igDate||'—'}</td><td>${r.kakao??'—'}</td><td>${r.status||''}</td></tr>`).join('');
 const T=['경인담당','강남담당','경원담당','경북담당','경남담당','중부담당','서부담당','백화점담당'];
 document.getElementById('teams').innerHTML=T.map(t=>{const rs=L.filter(r=>r.team===t);return `<tr><td>${t}</td><td>${rs.length}</td><td>${hasIgDate?rs.filter(r=>r.igDate===today).length:'—'}</td><td>${rs.filter(r=>r.kakao!=null).length}</td></tr>`}).join('');
})();
</script></body></html>
