name: 리뷰 수집(네이버·LG)
on:
  schedule:
    - cron: "0 21 * * *"   # 한국 시각 06:00 전국 297곳 (9시 전 마무리, 261120 변경)
    - cron: "0 6,9,11 * * *"   # 한국 시각 15·18·20시 경북 29곳만 당일 숫자 다시 셈 (261120 사용자 요청)
  workflow_dispatch:
    inputs:
      team: { description: "담당만 (비우면 전체)", required: false, default: "" }
      full: { description: "11/1부터 다시 셈 (1=예)", required: false, default: "" }
      debug: { description: "블로그 점검 기록 남김 (1=예)", required: false, default: "" }
concurrency: { group: review-collect, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy: { fail-fast: false, matrix: { part: [0, 1, 2, 3, 4, 5, 6, 7] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright openpyxl && python -m playwright install --with-deps chromium
      - run: python scripts/review_gh.py collect ${{ matrix.part }} 8
        env: { TEAM: "${{ github.event_name == 'schedule' && github.event.schedule == '0 6,9,11 * * *' && '경북' || github.event.inputs.team }}", FULL: "${{ github.event.inputs.full }}", NV_DEBUG: "${{ github.event.inputs.debug }}" }   # 6시 = 전국, 15·18·20시 = 경북만, 수동 실행은 담당 지정 가능 (261120)
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "part${{ matrix.part }}", path: parts/, if-no-files-found: ignore }
  merge:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright openpyxl
      - uses: actions/download-artifact@v4
        with: { path: parts }
      - run: |   # 261120: 저장 충돌 방지 — 매번 최신 데이터를 받아 그 위에서 다시 합치고 올림
          git config user.name "review-bot"; git config user.email "review-bot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python scripts/review_gh.py merge
            git add data/review_hist.json data/reviews.json
            git diff --cached --quiet && exit 0
            git commit -q -m "리뷰 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push -q origin HEAD:main && exit 0
            sleep 7
          done
          exit 1
