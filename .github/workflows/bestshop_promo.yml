name: 베스트샵 판촉 수집
on:
  workflow_dispatch:
concurrency: { group: bestshop-promo, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q openpyxl
      - run: python scripts/bestshop_promo_collect.py
      - run: python scripts/lge_full_excel.py
      - run: |
          git config user.name "lge-bot"; git config user.email "lge-bot@users.noreply.github.com"
          cp data/lge_full/bestshop_promos.json /tmp/bp.json; cp data/lge_full/*.xlsx /tmp/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/bp.json data/lge_full/bestshop_promos.json
            rm -f data/lge_full/*.xlsx; cp /tmp/*.xlsx data/lge_full/ 2>/dev/null || true
            git add -A data/lge_full
            git diff --cached --quiet && exit 0
            git commit -q -m "베스트샵 판촉 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push -q origin HEAD:main && exit 0
            sleep 7
          done
          exit 1
