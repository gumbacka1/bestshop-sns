name: 교원 수집(라이프·케어)
on:
  schedule:
    - cron: "10 23 * * *"       # 한국 시각 08:10 시작 → 9시에 볼 수 있게 (전국)
    - cron: "10 5,8,10 * * *"   # 한국 시각 14:10·17:10·19:10 시작 → 15·18·20시에 볼 수 있게 (전국) — 261123 사용자 결정
  workflow_dispatch:
    inputs:
      debug: { description: "화면 구조 점검 기록 남김 (1=예)", required: false, default: "" }
      backfill: { description: "올해 지난달 신청완료 다시 받기 (1=예)", required: false, default: "" }
concurrency: { group: kyowon-collect, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright pandas openpyxl xlrd lxml cryptography && python -m playwright install --with-deps chromium
      - run: python scripts/kyowon_collect.py
        env:
          KW_LIFE_ID: ${{ secrets.KW_LIFE_ID }}
          KW_LIFE_PW: ${{ secrets.KW_LIFE_PW }}
          KW_CARE_ID: ${{ secrets.KW_CARE_ID }}
          KW_CARE_PW: ${{ secrets.KW_CARE_PW }}
          KW_ADMIN_PW: ${{ secrets.KW_ADMIN_PW }}
          KW_DEBUG: ${{ github.event.inputs.debug }}
          KW_BACKFILL: ${{ github.event.inputs.backfill }}
      - run: |
          git config user.name "kyowon-bot"; git config user.email "kyowon-bot@users.noreply.github.com"
          cp data/kyowon.json /tmp/kyowon.json
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/kyowon.json data/kyowon.json
            git add data/kyowon.json
            git diff --cached --quiet && exit 0
            git commit -q -m "교원 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push -q origin HEAD:main && exit 0
            sleep 7
          done
          exit 1
