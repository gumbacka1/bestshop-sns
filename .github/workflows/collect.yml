name: SNS 수집

on:
  schedule:
    # 한국 시각 6·7·8·9시(전국) + 12~20시 매시간(경북만) — 깃허브는 UTC 기준, 몇 분~수십 분 늦게 돌 수 있어요
    - cron: '3 21 * * *'
    - cron: '3 22 * * *'
    - cron: '3 23 * * *'
    - cron: '3 0 * * *'
    - cron: '3 3-11 * * *'
  workflow_dispatch:
    inputs:
      hour:
        description: '이 시각 일정으로 실행 (비우면 지금 시각)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: sns-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 시각별 할 일 정하기
        id: plan
        run: |
          H=$(TZ=Asia/Seoul date +%-H)
          if [ -n "${{ github.event.inputs.hour }}" ]; then H=${{ github.event.inputs.hour }}; fi
          # 표: 시 | 카톡(K=1 건너뜀) | 인스타 전국 최대 개수(M) | 시간별 담당(T)
          # 6·7·8시 100개씩 → 9시에 빠진 곳 보충 + 카톡(하루 1번) → 9시에 전국 마무리
          # 12~20시는 경북담당 29곳만 매시간 새로 수집(시간별 기록), 전국·카톡은 안 함
          T=""
          if   [ $H -lt 9 ];  then K=1; M=100
          elif [ $H -lt 12 ]; then K=0; M=100
          else                     K=1; M=0; T="경북담당"
          fi
          W=0   # 내 권역 새 글 확인은 261120 사용자 요청으로 없앰
          echo "skip_kakao=$K" >> $GITHUB_OUTPUT
          echo "ig_max=$M" >> $GITHUB_OUTPUT
          if [ $W = 1 ]; then echo "watch=황금본점,제주본점,이도본점,율하점,범어점,서귀포점" >> $GITHUB_OUTPUT; else echo "watch=" >> $GITHUB_OUTPUT; fi
          echo "team=$T" >> $GITHUB_OUTPUT
          echo "hour=$H" >> $GITHUB_OUTPUT
      - name: 수집
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: '17841464921962064'
          IG_MAX: ${{ steps.plan.outputs.ig_max }}
          SKIP_KAKAO: ${{ steps.plan.outputs.skip_kakao }}
          WATCH: ${{ steps.plan.outputs.watch }}
          TEAM_REFRESH: ${{ steps.plan.outputs.team }}
        run: |
          python3 scripts/sns_collect.py scripts/master.tsv data/daily.json data/daily.json data/latest.json | tee run.log
          python3 - <<'PY'
          import json, datetime as dt
          p = json.load(open('data/new_posts.json'))
          now = dt.datetime.now(dt.timezone(dt.timedelta(hours=9))).strftime('%Y-%m-%d %H:%M')
          json.dump({'at': now, 'posts': p}, open('data/new_posts.json', 'w'), ensure_ascii=False, indent=1)
          log = open('run.log').read()
          json.dump({'at': now, 'hour': ${{ steps.plan.outputs.hour }}, 'log': log[-1500:]}, open('data/last_run.json', 'w'), ensure_ascii=False, indent=1)
          PY
      - name: 자동 점검
        run: python3 scripts/sns_verify.py data/latest.json data/daily.json data/verify.json || echo "점검 실패"
      - name: 저장
        run: |
          git config user.name "gumbacka1"
          git config user.email "gumbacka1@users.noreply.github.com"
          git add data/
          git commit -m "데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" || echo "바뀐 것 없음"
          git pull --rebase -q origin main || true
          git push
