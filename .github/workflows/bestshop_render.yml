name: 베스트샵 판촉 화면 수집(브라우저+글자 인식)
on:
  workflow_dispatch:
concurrency: { group: bestshop-render, cancel-in-progress: false }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y tesseract-ocr tesseract-ocr-kor imagemagick >/dev/null
      - run: python scripts/bestshop_render.py
      - uses: actions/upload-artifact@v4
        with: { name: bestshop-render, path: /tmp/bs_render, retention-days: 14 }
      - run: |
          git config user.name "lge-bot"; git config user.email "lge-bot@users.noreply.github.com"
          cp data/lge_full/bestshop_render.json /tmp/br.json
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/br.json data/lge_full/bestshop_render.json
            git add data/lge_full/bestshop_render.json
            git diff --cached --quiet && exit 0
            git commit -q -m "베스트샵 판촉 화면 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push -q origin HEAD:main && exit 0
            sleep 7
          done
          exit 1
