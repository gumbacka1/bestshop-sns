name: probe
on: { workflow_dispatch: {} }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: python3 scripts/probe_prepay.py
      - uses: actions/upload-artifact@v4
        with:
          name: prepay
          retention-days: 2
          path: |
            prepay.json
            shot.png
