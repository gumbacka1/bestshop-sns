name: probe
on: { workflow_dispatch: {} }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow && python3 scripts/thumbs.py
      - uses: actions/upload-artifact@v4
        with: { name: thumbs, path: thumbs.json, retention-days: 2 }
