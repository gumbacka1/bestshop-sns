name: 엘지닷컴 랭킹 수집(닷컴 비교 판매)
on:
  schedule:
    - cron: "20 23 * * *"   # 한국 시각 08:20 시작 → 9시 전 완료 (약 12분)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/lge_collect.py, .github/workflows/lge_collect.yml]
concurrency: { group: lge-collect, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/lge_collect.py
      - run: |
          git config user.name "lge-bot"; git config user.email "lge-bot@users.noreply.github.com"
          cp data/lge_dotcom.json /tmp/lge_dotcom.json
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/lge_dotcom.json data/lge_dotcom.json
            git add data/lge_dotcom.json
            git diff --cached --quiet && exit 0
            git commit -q -m "엘지닷컴 랭킹 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push -q origin HEAD:main && exit 0
            sleep 7
          done
          exit 1
