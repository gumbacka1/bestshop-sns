<div class="top"><h1>닷컴 비교 판매 <span style="font-size:11px;font-weight:400;color:#f7c6d3">관리자 시험판</span></h1><div class="s" id="upd">불러오는 중…</div></div>

</div>
<script>
const S={mode:'buy',cat:0,grp:0,view:null,conv:false,adds:[],addSel:{},cust:false,card:0,pre:'none',preAmt:0,pv:0};let D=null;
function go(view,conv){history.replaceState({view:S.view,conv:S.conv,mode:S.mode,cat:S.cat,grp:S.grp},'');if(!S.view||!view||S.view.m!==view.m){S.adds=[];S.addSel={};}S.view=view;S.conv=!!conv;history.pushState({view,conv:!!conv,mode:S.mode,cat:S.cat,grp:S.grp},'');render();}

window.addEventListener('popstate',e=>{const st=e.state||{};S.view=st.view||null;S.conv=!!st.conv;if(st.mode)S.mode=st.mode;if(st.cat!=null)S.cat=st.cat;if(st.grp!=null)S.grp=st.grp;render();});
const won=x=>x||x===0?Number(x).toLocaleString('ko-KR'):'-';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const signed=x=>(x>0?'+':'')+won(x);
const allBuy=c=>c.groups.flatMap(g=>c.buy[g]);
function findItem(c,m,sub){if(!sub){const a=(c.all||[]).find(i=>i.m===m);if(a)return a;for(const g of c.groups){const x=c.buy[g].find(i=>i.m===m);if(x)return x}}for(const g of c.groups){const x=c.sub[g].find(i=>i.m===m);if(x)return x}return null}
function care6(m){const c=D.care[m];return c&&c.terms&&c.terms['72']?c.terms['72'].p:null}
async function load(){
  try{[D,MD,SP]=await Promise.all([fetch('data/lge_dotcom.json?v='+Date.now()).then(r=>r.json()),fetch('calc/models.json').then(r=>r.json()).then(j=>{const o={};j.models.forEach(x=>o[x.m]=x);return o}),fetch('calc/specs.json').then(r=>r.json())])}catch(e){document.getElementById('app').innerHTML='<p class="note">아직 수집된 데이터가 없어요. 매일 오전 9시에 자동으로 받아와요.</p>';return}
  document.getElementById('upd').innerHTML='엘지닷컴 오늘의 랭킹 · '+esc(D.updated)+' 기준 · <a href="admin-b7f21e3e.html">관리자 화면</a>';
  history.replaceState({view:null,conv:false,mode:S.mode,cat:S.cat,grp:S.grp},'');render();
}
function render(keep){if(!keep)window.scrollTo(0,0);document.body.classList.toggle('cust',S.cust);document.getElementById('app').innerHTML=promoBar()+(S.view?(S.view.type==='vs'?vsView():oneView()):listView());bindPromo();}
let MD={},SP={};
const CATG={'냉장고':'냉장고','에어컨':'에어컨'};
const capOf=m=>{const q=SP[m]||{};for(const k of Object.keys(q))if(/전체 용량|화면 크기|냉방면적|세탁 용량/.test(k)){const v=parseFloat(String(q[k]).replace(/,/g,''));if(v)return v}return null};
function subgrp(c,m){const it=(c.all||[]).find(i=>i.m===m);if(it&&it.g)return it.g;const s=(MD[m]||{}).s||'';
 if(c.name==='냉장고'){if(/양문/.test(s))return '양문형';const v=capOf(m);return v&&v>=750?'800L급':'600L급'}
 if(c.name==='에어컨')return /벽걸이/.test(s)?'벽걸이':/스탠드/.test(s)?'스탠드':'2in1';return null}
function info(c,m){const it=(c.all||[]).find(i=>i.m===m)||c.groups.map(g=>(c.buy[g]||[]).find(i=>i.m===m)).find(Boolean)||{},x=MD[m]||{},v=capOf(m),r=promoOf(m);
 return {m,n:it.n||x.n||m,img:it.img||x.img||'',sz:it.sz||(v?(c.name==='냉장고'?v+'L':v+''):''),gr:it.gr||((SP[m]||{})['에너지 소비효율등급']||''),rel:it.rel||'',
  max:it.max||x.mx||(x.p?x.p-x.d:0),price:it.price||(x.p?x.p-x.d:0),only:it.only,row:r}}
const pre=(a,b)=>{let i=0;while(i<a.length&&a[i]===b[i])i++;return i};
function storeFor(c,m){const mp=P&&P.rules&&P.rules['추천매칭']&&P.rules['추천매칭'][m],same=promoOf(m);
 if(same)return {same:true,list:[same],bplus:mp&&mp[1]!==same['모델']?promoOf(mp[1]):null,why:mp?mp[2]:''};
 if(mp){const L=[promoOf(mp[0]),promoOf(mp[1])].filter(Boolean).filter((r,i,a)=>a.indexOf(r)===i);if(L.length)return {same:false,list:L,why:mp[2],picked:true}}
 const g=CATG[c.name];if(!g)return {same:false,list:[]};
 const sg=subgrp(c,m),v=capOf(m),me=info(c,m);
 const L=prow().filter(r=>r.g===g&&(r['최종구독월']||r['결제가'])&&!isOff(r)).map(r=>{const rm=r['모델'],rv=capOf(rm),pr=r['체감가']||r['결제가']||0;
  const sg2=subgrp(c,rm),near=(sg==='2in1'&&sg2==='스탠드')||(sg==='스탠드'&&sg2==='2in1');const sc=(sg&&sg2!==sg?(near?2:10):0)+(r['최종구독월']?0:5)+(v&&rv?Math.abs(rv-v)/v*3:1)+(me.max&&pr?Math.abs(pr-me.max)/me.max:0.5)-(r['구독할인']?0.05:0)-Math.min(pre(m,rm),7)*0.3;return {r,sc}}).sort((a,b)=>a.sc-b.sc);
 return {same:false,list:L.slice(0,4).map(z=>z.r)}}
function listView(){
  const c=D.cats[S.cat],g=c.groups[S.grp],L=(S.mode==='buy'?c.buy:c.sub)[g]||[];
  let h=`<div class="mode"><button class="${S.mode==='buy'?'on':''}" onclick="S.mode='buy';render()">일시불</button><button class="${S.mode==='sub'?'on':''}" onclick="S.mode='sub';render()">구독</button></div>`;
  h+=`<div class="cts">${D.cats.map((x,i)=>`<button class="${i===S.cat?'on':''}" onclick="S.cat=${i};S.grp=0;render()">${esc(x.name)}</button>`).join('')}</div>`;
  h+=`<div class="gcs">${c.groups.map((x,i)=>`<button class="${i===S.grp?'on':''}" onclick="S.grp=${i};render()">${esc(x)} <small>${((S.mode==='buy'?c.buy:c.sub)[x]||[]).length}</small></button>`).join('')}</div>`;
  h+=`<div class="hd">${esc(c.name)} · ${esc(g)} ${S.mode==='buy'?'일시불':'구독'} TOP ${L.length}</div>`;
  h+=L.map((x,j)=>row(c,x,j)).join('');
  h+=`<div class="foot">매장 판매 = 불러온 판촉안에 있는 모델만. 판촉안에 없는 닷컴 모델은 판촉안 모델 중 같은 분류 · 용량 가까운 순 · 가격 가까운 순으로 추천해요.</div>`;
  return h;
}
function row(c,x,j){
  const f=storeFor(c,x.m);let mt,click='';
  if(!P) mt='<div class="mt na"><span class="mm">판촉 파일을 불러오면 매장 모델이 보여요</span></div>';
  else if(f.same){const r=f.list[0];mt=`<div class="mt sm"><span class="ok">매장 판매</span><span class="mm">${r['최종구독월']?'구독 월 '+won(r['최종구독월']):''}${r['체감가']?' · 일시불 '+won(r['체감가']):''}</span><span class="go">비교카드 ›</span></div>`;click=`go({type:'one',m:'${x.m}'})`;}
  else if(f.list.length){const r=f.list[0];mt=`<div class="mt"><span class="vsb">VS</span><span class="mm">매장 <b>${esc(r['모델'])}</b>${r['최종구독월']?' · 구독 '+won(r['최종구독월']):''}</span><span class="go">대결카드 ›</span></div>`;click=`go({type:'vs',m:'${x.m}',st:'${esc(r['모델'])}'},false)`;}
  else mt='<div class="mt na"><span class="mm">판촉안에 대응 모델 없음</span></div>';
  const price=S.mode==='buy'?`<span class="lb">최대혜택가</span> ${won(x.max)}`:`<span class="lb">월</span> ${won(x.price)}`;
  return `<div class="it" ${click?`onclick="${click}"`:''}><div class="rk">${j+1}</div><img loading="lazy" src="${esc(x.img)}" alt=""><div class="tx"><div class="nm">${esc(x.n)}</div>
  <div class="md">${esc(x.m)} · ${esc(x.sz)}${x.gr?' · '+esc(x.gr):''} ${x.only?'<span class="bo">닷컴 ONLY</span>':''}</div>
  <div class="pr">${price}<span class="all">전체 ${x.r}위</span></div>${mt}</div></div>`;
}
function storeCard(c,st,label){const r=st.row||{};return `<div class="cd st"><span class="lab">${label}</span>${st.img?`<img src="${esc(st.img)}" alt="">`:''}<div class="m">${esc(st.m)}</div><div class="u">${esc(st.sz)}${st.gr?' · '+esc(st.gr):''}</div>
 <div class="pz"><small>매장 일시불</small>${r['체감가']?won(r['체감가']):(r['결제가']?won(r['결제가']):'-')}</div><div class="sb" style="color:#A50034;font-weight:700">${r['최종구독월']?'구독 6년 월 '+won(r['최종구독월']):'구독 미운영'}</div></div>`}
function storeTerms(st){const x=MD[st.m]||{},r=st.row||{},T=['36','48','60','72'],N={'36':'3년','48':'4년','60':'5년','72':'6년'};
 return `<table><tr><th style="width:30%">기간</th><th>매장 ${esc(st.m)}</th></tr>${T.filter(t=>(x.sub&&x.sub[t])||(t==='72'&&r['최종구독월'])).map(t=>`<tr class="${t==='72'?'on':''}"><td class="k">${N[t]}</td><td>${t==='72'&&r['최종구독월']?won(r['최종구독월'])+' <small>(판촉)</small>':won(x.sub[t][0])}</td></tr>`).join('')}</table>`}
function specRows(a,b,x,st){const A=SP[a]||{},B=SP[b]||{},rows=[['크기·용량',x.sz,st.sz],['에너지',x.gr,st.gr]],same=[];
 Object.keys(A).forEach(k=>{if(!(k in B)||/색상|크기 \(|무게|모델명|출시/.test(k))return;(A[k]!==B[k]?rows:same).push(A[k]!==B[k]?[k,A[k],B[k]]:[k,A[k]])});return {rows:rows.slice(0,16),same:same.slice(0,6)}}
function compareTable(c,x,st,lab){const sp=specRows(x.m,st.m,x,st);
 return `<div class="sec"><div class="st2">한눈에 비교 <span style="font-size:11px;font-weight:400;color:#888">노란 줄 = 다른 점</span></div><table><tr><th style="width:28%">항목</th><th>닷컴</th><th style="color:#A50034">${lab}</th></tr>`+
 sp.rows.map(r=>`<tr class="${r[1]!==r[2]?'df':''}"><td class="k">${esc(r[0])}</td><td>${esc(r[1]||'-')}</td><td>${esc(r[2]||'-')}</td></tr>`).join('')+
 `<tr><td class="k">판매가</td><td>${won(x.price)}</td><td>${won((st.row||{})['결제가']||st.price)}</td></tr><tr class="df"><td class="k">구매처</td><td>${x.only?'<b style="color:#A50034">닷컴 전용</b>':'닷컴·매장'}</td><td><b>매장</b></td></tr></table>`+
 (sp.same.length?`<div class="foot" style="padding:6px 0 0">같은 점: ${sp.same.map(s=>esc(s[0])+' '+esc(s[1])).join(' · ')}</div>`:'')+`</div>`}
function vsView(){
  const c=D.cats[S.cat],x=info(c,S.view.m),f0=storeFor(c,S.view.m),f=f0.same?{list:[f0.bplus,f0.list[0]].filter(Boolean),why:f0.why,picked:true,up:true}:f0,stm=S.view.st||(f.list[0]&&f.list[0]['모델']),st=info(c,stm),r=st.row||{};
