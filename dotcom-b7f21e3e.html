<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>닷컴 비교 판매 · 관리자 시험판</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f2f2;font-family:"LG스마트체2.0 Regular","LG스마트체","Pretendard","Malgun Gothic",sans-serif;color:#1a1a1a}
.ph{max-width:480px;margin:0 auto;background:#fff;min-height:100vh;padding-bottom:30px}
.top{background:#1f1f1f;color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:5}
.top h1{font-size:17px;margin:0}.top .s{font-size:11px;color:#aaa;margin-top:3px}.top a{color:#aaa}
.mode{display:flex;margin:12px 16px 0;border:1.5px solid #1f1f1f;border-radius:10px;overflow:hidden}
.mode button{flex:1;border:0;background:#fff;font:inherit;font-size:14px;font-weight:700;padding:9px 0;color:#555;cursor:pointer}
.mode button.on{background:#1f1f1f;color:#fff}
.cts{display:flex;overflow-x:auto;border-bottom:1px solid #e5e5e5;margin-top:8px;scrollbar-width:none}
.cts button{flex:none;border:0;background:none;font:inherit;font-size:14px;padding:11px 13px;color:#777;border-bottom:3px solid transparent;cursor:pointer}
.cts button.on{color:#1a1a1a;font-weight:700;border-bottom-color:#A50034}
.gcs{display:flex;gap:6px;padding:10px 16px 2px;flex-wrap:wrap}
.gcs button{font:inherit;font-size:12.5px;padding:6px 13px;border-radius:999px;border:1px solid #ccc;color:#555;background:#fff;cursor:pointer}
.gcs button small{font-size:10px;color:#999}.gcs button.on{background:#A50034;border-color:#A50034;color:#fff;font-weight:700}.gcs button.on small{color:#f7c6d3}
.hd{font-size:14px;font-weight:700;padding:12px 16px 4px}
.it{display:flex;gap:9px;padding:10px 16px;border-top:1px solid #f0f0f0;align-items:flex-start;cursor:pointer}
.it:active{background:#fafafa}
.rk{flex:none;width:22px;height:22px;background:#1f1f1f;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.it img{flex:none;width:56px;height:56px;object-fit:contain}
.tx{flex:1;min-width:0}.nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md{font-size:11px;color:#777;margin-top:1px}
.bo{font-size:9.5px;font-weight:700;color:#fff;background:#e4002b;border-radius:999px;padding:1px 6px;margin-left:2px;white-space:nowrap}
.pr{font-size:13px;font-weight:700;margin-top:2px;color:#e4002b}.pr .lb{font-size:10.5px;font-weight:400}
.pr .all{float:right;font-size:10.5px;color:#aaa;font-weight:400}
.mt{display:flex;align-items:center;gap:4px;margin-top:5px;font-size:11px;background:#fff;border:1px solid #A50034;border-radius:6px;padding:4px 6px;color:#333}
.mt b{color:#A50034}.vsb{font-size:9px;font-weight:700;background:#A50034;color:#fff;border-radius:3px;padding:0 4px}
.mt.sm{border-color:#ddd;background:#fafafa}.ok{font-size:9.5px;font-weight:700;color:#1a7f37;border:1px solid #1a7f37;border-radius:3px;padding:0 3px}
.mt.na{border-color:#ddd;color:#999}.mm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.go{flex:none;font-weight:700;color:#A50034}
.warn{font-size:10px;color:#8a5a00;background:#fff1c2;border-radius:3px;padding:0 4px;margin-left:3px}
.few{font-size:11.5px;color:#888;text-align:center;padding:10px 16px;border-top:1px solid #f0f0f0}
.foot{font-size:10.5px;color:#888;padding:10px 16px 0;line-height:1.55}
.back{display:flex;align-items:center;gap:6px;padding:12px 16px 0;font-size:13px;color:#555;cursor:pointer}
.vs{display:grid;grid-template-columns:1fr 24px 1fr;padding:12px 16px 0}
.cd{border:1px solid #ddd;border-radius:12px;padding:10px 8px;text-align:center}
.cd.st{border:2px solid #A50034;background:#fdf6f8}
.lab{display:inline-block;font-size:11px;font-weight:700;padding:2px 10px;border-radius:999px;background:#eee;color:#555}
.st .lab{background:#A50034;color:#fff}
.cd img{width:100%;max-width:120px;height:120px;object-fit:contain;display:block;margin:6px auto 4px}
.cd .m{font-size:13px;font-weight:700;word-break:break-all}.cd .u{font-size:11px;color:#777;margin-top:1px}
.pz{font-size:17px;font-weight:700;margin-top:6px}.pz small{font-size:11px;font-weight:400;color:#777;display:block}
.sb{font-size:12px;margin-top:3px;color:#333}
.vsm{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#A50034}
.sec{padding:14px 16px 0}.st2{font-size:14px;font-weight:700;margin:0 0 6px}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}
td,th{padding:7px 4px;border-top:1px solid #e8e8e8;text-align:center;word-break:keep-all;overflow-wrap:anywhere}
th{background:#EDEDED;font-size:11.5px}
td.k{text-align:left;color:#666;font-size:11.5px}
tr.df td{background:#fffbe0}tr.on td{background:#fdf1f4;font-weight:700}
.gap{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.gb{background:#f5f5f5;border-radius:8px;padding:8px;text-align:center}.gb .t{font-size:11px;color:#666}.gb .v{font-size:15px;font-weight:700;margin-top:2px}.gb .v.r{color:#A50034}
.cta{display:block;width:calc(100% - 32px);margin:14px 16px 0;border:0;background:#A50034;color:#fff;border-radius:10px;padding:11px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.cta small{display:block;font-size:11px;font-weight:400;color:#f7c6d3;margin-top:2px}
.inc{margin-top:10px;border:1px solid #e3e3e3;border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.7}
.calc{margin-top:8px;background:#fff8d6;border-radius:8px;padding:9px 11px;font-size:12px;line-height:1.6}
.note{margin:10px 16px 0;font-size:11.5px;background:#fff1c2;color:#6b4a00;border-radius:8px;padding:8px 10px;line-height:1.5}
.pm{margin:8px 12px;padding:10px 12px;border:1px solid #ddd;border-radius:10px;background:#fff;font-size:13px}.pm label,.pm button{display:inline-block;border:1px solid #bbb;background:#fff;border-radius:8px;padding:6px 10px;font-size:12px;margin:6px 4px 0 0}
.shop{margin-top:8px;padding:10px;border-radius:10px;background:#fff5f7;border:1px solid #f3c2cf;font-size:13px}.shop b{color:#A50034}
.add{border:1px solid #ddd;border-radius:10px;padding:10px;margin:8px 0;background:#fff}.add.in{border:2px solid #A50034;background:#fffafa}.add select{width:100%;padding:7px;border:1px solid #ccc;border-radius:6px;font-size:13px;margin:6px 0}
.pl{display:inline-block;font-size:11px;padding:2px 7px;border-radius:10px;background:#fde8ec;color:#A50034;margin-left:4px}.pl.g{background:#eee;color:#555}.ab{border:1px solid #A50034;color:#A50034;background:#fff;border-radius:8px;padding:5px 12px;font-size:13px}
.tot{position:sticky;bottom:0;background:#111;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:10px}.tot b{font-size:19px}
body.cust .mgr{display:none!important}
</style></head><body><div class="ph">
<div class="top"><h1>닷컴 비교 판매 <span style="font-size:11px;font-weight:400;color:#f7c6d3">관리자 시험판</span></h1><div class="s" id="upd">불러오는 중…</div></div>
<div id="app"></div>
</div>
<script>
const S={mode:'buy',cat:0,grp:0,view:null,conv:false,adds:[],addSel:{},cust:false};let D=null;
function go(view,conv){history.replaceState({view:S.view,conv:S.conv,mode:S.mode,cat:S.cat,grp:S.grp},'');if(!S.view||!view||S.view.m!==view.m){S.adds=[];S.addSel={};}S.view=view;S.conv=!!conv;history.pushState({view,conv:!!conv,mode:S.mode,cat:S.cat,grp:S.grp},'');render();}
function back(){history.back();}
window.addEventListener('popstate',e=>{const st=e.state||{};S.view=st.view||null;S.conv=!!st.conv;if(st.mode)S.mode=st.mode;if(st.cat!=null)S.cat=st.cat;if(st.grp!=null)S.grp=st.grp;render();});
const won=x=>x||x===0?Number(x).toLocaleString('ko-KR'):'-';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const signed=x=>(x>0?'+':'')+won(x);
const allBuy=c=>c.groups.flatMap(g=>c.buy[g]);
function findItem(c,m,sub){if(!sub){const a=(c.all||[]).find(i=>i.m===m);if(a)return a;for(const g of c.groups){const x=c.buy[g].find(i=>i.m===m);if(x)return x}}for(const g of c.groups){const x=c.sub[g].find(i=>i.m===m);if(x)return x}return null}
function care6(m){const c=D.care[m];return c&&c.terms&&c.terms['72']?c.terms['72'].p:null}
async function load(){
  try{D=await fetch('data/lge_dotcom.json?v='+Date.now()).then(r=>r.json())}catch(e){document.getElementById('app').innerHTML='<p class="note">아직 수집된 데이터가 없어요. 매일 오전 9시에 자동으로 받아와요.</p>';return}
  document.getElementById('upd').innerHTML='엘지닷컴 오늘의 랭킹 · '+esc(D.updated)+' 기준 · <a href="admin-b7f21e3e.html">관리자 화면</a>';
  history.replaceState({view:null,conv:false,mode:S.mode,cat:S.cat,grp:S.grp},'');render();
}
function render(keep){if(!keep)window.scrollTo(0,0);document.body.classList.toggle('cust',S.cust);document.getElementById('app').innerHTML=promoBar()+(S.view?(S.view.type==='vs'?vsView():oneView()):listView());bindPromo();}
function listView(){
  const c=D.cats[S.cat],g=c.groups[S.grp],L=(S.mode==='buy'?c.buy:c.sub)[g]||[];
  let h=`<div class="mode"><button class="${S.mode==='buy'?'on':''}" onclick="S.mode='buy';render()">일시불</button><button class="${S.mode==='sub'?'on':''}" onclick="S.mode='sub';render()">구독</button></div>`;
  h+=`<div class="cts">${D.cats.map((x,i)=>`<button class="${i===S.cat?'on':''}" onclick="S.cat=${i};S.grp=0;render()">${esc(x.name)}</button>`).join('')}</div>`;
  h+=`<div class="gcs">${c.groups.map((x,i)=>`<button class="${i===S.grp?'on':''}" onclick="S.grp=${i};render()">${esc(x)} <small>${((S.mode==='buy'?c.buy:c.sub)[x]||[]).length}</small></button>`).join('')}</div>`;
  h+=`<div class="hd">${esc(c.name)} · ${esc(g)} ${S.mode==='buy'?'일시불':'구독'} TOP ${L.length}</div>`;
  h+=L.map((x,j)=>S.mode==='buy'?buyRow(c,x,j):subRow(c,x,j)).join('');
  const tot=S.mode==='buy'?c.n_buy:c.n_sub;
  if(L.length<10)h+=`<div class="few">엘지닷컴 ${S.mode==='buy'?'오늘의':'구독'} 랭킹 상위 ${tot}개 안에 ${esc(g)}는 ${L.length}개예요</div>`;
  h+=`<div class="foot">${S.mode==='buy'?'닷컴 ONLY 모델 → 매장 대응 모델 자동 매칭: 닷컴 전용 아님 · 같은 분류 · 26년 출시 우선(없으면 25년) · 크기/용량 가까운 순 · 같은 라인 우선.<br>':''}전체 순위는 엘지닷컴 랭킹 그대로예요. 매장 행사가·카드 혜택은 들어 있지 않아요.</div>`;
  return h;
}
function buyRow(c,x,j){
  let mt;
  if(x.only){
    const m=x.match?findItem(c,x.match):null;
    mt=m?`<div class="mt"><span class="vsb">VS</span><span class="mm">매장 <b>${esc(m.m)}</b> · ${esc(m.sz)} · ${won(m.max)}${x.far?'<span class="warn">크기 차이 큼</span>':''}</span><span class="go">대결카드 ›</span></div>`:'<div class="mt na"><span class="mm">매장 대응 모델 없음 (기준 확대 필요)</span></div>';
  }else mt=`<div class="mt sm"><span class="ok">매장 판매</span><span class="mm">같은 모델 · 일시불↔구독 비교</span><span class="go">비교카드 ›</span></div>`;
  const click=x.only&&x.match?`go({type:'vs',m:'${x.m}'},false)`:(x.only?'':`go({type:'one',m:'${x.m}'})`);
  return `<div class="it" onclick="${click}"><div class="rk">${j+1}</div><img loading="lazy" src="${esc(x.img)}" alt=""><div class="tx"><div class="nm">${esc(x.n)}</div>
  <div class="md">${esc(x.m)} · ${esc(x.sz)}${x.gr?' · '+esc(x.gr):''} ${x.only?'<span class="bo">닷컴 ONLY</span>':''}</div>
  <div class="pr"><span class="lb">최대혜택가</span> ${won(x.max)}<span class="all">전체 ${x.r}위</span></div>${mt}</div></div>`;
}
function subRow(c,x,j){
  const has=D.care[x.m]&&D.care[x.m].terms;
  return `<div class="it" ${has?`onclick="go({type:'one',m:'${x.m}',sub:1})"`:''}><div class="rk">${j+1}</div><img loading="lazy" src="${esc(x.img)}" alt=""><div class="tx"><div class="nm">${esc(x.n)}</div>
  <div class="md">${esc(x.m)} · ${esc(x.sz)}${x.gr?' · '+esc(x.gr):''}</div>
  <div class="pr"><span class="lb">월</span> ${won(x.price)}<span class="lb"> ${esc(x.desc)}</span><span class="all">전체 ${x.r}위</span></div>
  ${x.max&&x.max<x.price?`<div class="md">최대 혜택 시 월 ${won(x.max)} (제휴카드 등 조건)</div>`:''}</div></div>`;
}
function termsTable(ms,labels){
  const T=['36','48','60','72'],N={'36':'3년','48':'4년','60':'5년','72':'6년'};
  const rows=T.filter(t=>ms.some(m=>D.care[m]&&D.care[m].terms&&D.care[m].terms[t]));
  if(!rows.length)return '<p class="note">구독 요금을 아직 못 받았어요.</p>';
  return `<table><tr><th style="width:22%">기간</th>${labels.map(l=>`<th>${l}</th>`).join('')}</tr>${rows.map(t=>`<tr class="${t==='72'?'on':''}"><td class="k">${N[t]}</td>${ms.map(m=>{const v=D.care[m]&&D.care[m].terms[t];return `<td>${v?won(v.p):'-'}</td>`}).join('')}</tr>`).join('')}</table>`;
}
function careBox(m){const c=D.care[m];if(!c)return '';return `<div class="inc"><b>구독에 들어 있는 것</b><br>· 방문 케어: ${esc(c.cycle||'-')} · ${esc(c.care||'-')}<br>· 계약기간 무상 A/S (고객 과실 제외)<br><span style="font-size:11px;color:#888">세부 내용은 엘지닷컴 구독 상세 기준</span></div>`}
function vsView(){
  const c=D.cats[S.cat],x=findItem(c,S.view.m),card=D.cards[S.view.m],st=findItem(c,card.store);
  const a6=care6(x.m),b6=care6(st.m);
  let h=`<div class="back" onclick="back()">‹ ${esc(c.name)} 목록으로</div>`;
  h+=`<div class="vs"><div class="cd"><span class="lab">닷컴</span><img src="${esc(x.img)}" alt=""><div class="m">${esc(x.m)}</div><div class="u">${esc(x.sz)}${card.soldA?' · '+esc(card.soldA):''}</div><div class="u" style="color:#A50034;font-weight:700">닷컴 전용</div><div class="pz"><small>최대혜택가</small>${won(x.max)}</div><div class="sb">${a6?'구독 6년 월 '+won(a6):'구독 정보 없음'}</div></div>
  <div class="vsm">VS</div>
  <div class="cd st"><span class="lab">매장 추천</span><img src="${esc(st.img)}" alt=""><div class="m">${esc(st.m)}</div><div class="u">${esc(st.sz)}${card.soldB?' · '+esc(card.soldB):''}</div><div class="u">${esc(st.rel.replace('-','년 '))}월 출시${st.bts?' · 매장 인기':''}</div><div class="pz"><small>최대혜택가</small>${won(st.max)}</div><div class="sb">${b6?'구독 6년 월 '+won(b6):'구독 정보 없음'}</div></div></div>`;
  if(card.far)h+=`<div class="note">크기/용량 차이가 커요. 매칭이 맞는지 확인이 필요해요.</div>`;
  if(!S.conv){
    const rows=[['크기·용량',x.sz,st.sz],['에너지',x.gr,st.gr],['출시',x.rel,st.rel]].concat(card.diff.map(d=>[d[0],d[1],d[2]]));
    h+=`<div class="sec"><div class="st2">한눈에 비교 <span style="font-size:11px;font-weight:400;color:#888">노란 줄 = 다른 점</span></div><table><tr><th style="width:28%">항목</th><th>닷컴</th><th style="color:#A50034">매장</th></tr>`+
      rows.map(r=>`<tr class="${r[1]!==r[2]?'df':''}"><td class="k">${esc(r[0])}</td><td>${esc(r[1]||'-')}</td><td>${esc(r[2]||'-')}</td></tr>`).join('')+
      `<tr><td class="k">판매가</td><td>${won(x.price)}</td><td>${won(st.price)}</td></tr><tr class="df"><td class="k">구매처</td><td style="color:#A50034;font-weight:700">닷컴 전용</td><td><b>매장·닷컴</b></td></tr></table>`;
    if(card.same&&card.same.length)h+=`<div class="foot" style="padding:6px 0 0">같은 점: ${card.same.map(s=>esc(s[0])+' '+esc(s[1])).join(' · ')}</div>`;
    h+=`<div class="gap"><div class="gb"><div class="t">최대혜택가 차이</div><div class="v r">${signed(st.max-x.max)}원</div></div><div class="gb"><div class="t">구독 6년 월 차이</div><div class="v r">${a6&&b6?signed(b6-a6)+'원':'-'}</div><div class="t">${a6&&b6?'하루 약 '+won(Math.round((b6-a6)/30/100)*100)+'원':''}</div></div></div></div>`;
    h+=`<button class="cta" onclick="go(S.view,true)">구독으로 전환해서 보여 주기<small>같은 두 모델을 월 요금으로 다시 비교</small></button>`;
  }else{
    h+=`<div class="sec"><div class="st2">계약기간별 월 요금</div>${termsTable([x.m,st.m],['닷컴 '+esc(x.m),'매장 '+esc(st.m)])}`;
    if(b6){h+=`<div class="gap"><div class="gb"><div class="t">6년 기준 월 차이</div><div class="v r">${a6?signed(b6-a6)+'원':'-'}</div><div class="t">${a6?'하루 약 '+won(Math.round((b6-a6)/30/100)*100)+'원':''}</div></div><div class="gb"><div class="t">매장 모델 6년 총액</div><div class="v">${won(b6*72)}원</div><div class="t">${won(b6)} × 72개월</div></div></div>`;
      const m=Math.round(st.max/72/100)*100;h+=careBox(st.m)+`<div class="calc"><b>"일시불이 더 싸지 않아요?" 물으면</b><br>일시불 ${won(st.max)} ÷ 72개월 = 월 약 ${won(m)}원 → 구독 ${won(b6)}원과 월 약 ${won(b6-m)}원 차이가 6년간 방문 케어·무상 A/S 값이라고 솔직하게 설명</div>`;}
    h+=`</div><button class="cta" style="background:#555" onclick="back()">일시불 비교로 돌아가기</button>`;
  }
  h+=shopBox(st.m,b6)+addBlock(c,st.m,b6);
  h+=`<div class="foot">최대혜택가 = 엘지닷컴 표시 그대로(판매가 − 쿠폰 할인 − 제휴카드 청구할인, 카드 실적 조건). 가격·사양: ${esc(D.updated)} 엘지닷컴 표시 기준. 구독 요금은 회원할인 반영·기본 방문주기 기준, 제휴카드 할인 제외. 매장 행사가 미포함.</div>`;
  return h;
}
function oneView(){
  const c=D.cats[S.cat],x=findItem(c,S.view.m,S.view.sub),b6=care6(x.m);
  let h=`<div class="back" onclick="back()">‹ ${esc(c.name)} 목록으로</div>`;

  h+=`<div class="sec"><div class="st2">일시불</div><table><tr><td class="k">판매가</td><td>${won(x.sub?0:x.price)}</td></tr><tr class="on"><td class="k">최대혜택가</td><td>${x.sub?'-':won(x.max)}</td></tr></table></div>`;
  h+=`<div class="sec"><div class="st2">구독으로 전환하면</div>${termsTable([x.m],['월 요금'])}`;
  if(b6&&!x.sub){const m=Math.round(x.max/72/100)*100;h+=`<div class="gap"><div class="gb"><div class="t">6년 구독 월</div><div class="v r">${won(b6)}원</div></div><div class="gb"><div class="t">일시불 월 환산(72개월)</div><div class="v">${won(m)}원</div></div></div>`+careBox(x.m)+`<div class="calc">월 약 ${won(b6-m)}원 차이가 6년간 방문 케어·무상 A/S 값이에요. 같은 모델이라 매장 혜택(카드·결합)을 더하면 차이가 더 줄어요.</div>`}
  else h+=careBox(x.m);
  h+=`</div>`+shopBox(x.m,b6)+addBlock(c,x.m,b6)+`<div class="foot">엘지닷컴 표시 기준. 매장 판촉은 불러온 판촉 파일 기준.</div>`;
  return h;
}
/* ── 매장 판촉(이 PC 브라우저에만 저장, 서버로 안 보냄) + 하나 더 담기 ── */
const LS='kgf_promo_v1';let P=null;try{P=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){}
const GROUPS=[['김치냉장고',/김치/],['냉장고',/냉장고/],['에어컨',/스탠드|사계절|벽걸이|에어컨/],['스타일러',/스타일러/],['식기세척기',/식기세척기/],['전기레인지',/전기레인지/],['광파오븐',/광파오븐/],['정수기',/정수기/],['안마의자',/안마의자/],['바스에어',/바스에어/],['공기청정기',/공기청정기/],['제습기',/제습기/],['틔운',/틔운/],['밥솥',/밥솥/],['소형',/OS Living/],['아이어닝',/아이어닝/]];
const LSPKEY={'냉장고':'DIOS','김치냉장고':'김치냉장고','에어컨':'에어컨','스타일러':'스타일러','식기세척기':'식기세척기','전기레인지':'전기레인지','공기청정기':'공기청정기','TV':'TV','세탁기':'TROMM','건조기':'TROMM','워시타워':'TROMM'};
const ORDER=['김치냉장고','식기세척기','스타일러','전기레인지','정수기','에어컨','공기청정기','안마의자','바스에어','광파오븐'];
const f100=n=>Math.floor(n/100)*100;
const grpOf=r=>{for(const[g,re]of GROUPS)if(re.test(r['구분']))return g;return r['구분']};
const reOf=k=>new RegExp('^'+k.replace(/\*/g,'.*').replace(/\(([^)]*)\)/g,(a,b)=>'('+b.split(/[,\/]/).join('|')+')')+'$');
const prow=()=>P?P.rows.map(r=>Object.assign({g:grpOf(r)},r)):[];
function promoOf(m){for(const r of prow()){try{if(r['모델']===m||reOf(r['모델']).test(m))return r}catch(e){}}return null}
const isOff=r=>/단종|소진|운영 종료|보관재고/.test(r['비고']||'');
const note=n=>S.cust?(n||'').split(' · ').filter(x=>!/컨테스트|추할가|할당|찐할세|활성화|역대|도전/.test(x)).join(' · '):(n||'');
function promoBar(){return `<div class="pm mgr">${P?`매장 판촉: <b>${esc(P.rules&&P.rules['행사']||'불러옴')}</b> · ${P.rows.length}개 모델 <span style="color:#888">(이 기기에만 저장)</span>`:'<b style="color:#A50034">매장 판촉 자료가 없어요.</b> 불러오면 매장 판촉가와 "하나 더 담기"가 열려요.'}<br><label>판촉 파일 불러오기<input type="file" id="pf" accept=".json" style="display:none"></label>${P?'<button id="pdel">판촉 지우기</button>':''}<button id="pimg">판촉 이미지 붙여넣기 (준비 중)</button><button id="cust">고객 화면</button></div>`+(S.cust?'<div class="pm"><button id="cust2">매니저 화면으로</button></div>':'')}
function bindPromo(){const pf=document.getElementById('pf');if(pf)pf.onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.rows)throw 0;P=d;try{localStorage.setItem(LS,t)}catch(x){}render(true)}catch(x){alert('판촉 파일 형식이 아니에요')}})};
 const pd=document.getElementById('pdel');if(pd)pd.onclick=()=>{if(confirm('이 기기에 저장된 판촉 자료를 지울까요?')){localStorage.removeItem(LS);P=null;render(true)}};
 const pi=document.getElementById('pimg');if(pi)pi.onclick=()=>alert('판촉 이미지 붙여넣기(글자 인식)는 다음 단계에서 만들어요.');
 ['cust','cust2'].forEach(id=>{const b=document.getElementById(id);if(b)b.onclick=()=>{S.cust=!S.cust;render(true)}});
 document.querySelectorAll('select[data-g]').forEach(x=>x.onchange=()=>{S.addSel[x.dataset.g]=x.value;render(true)});
 document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const c=window.__cands.find(z=>z.g===b.dataset.add);S.adds.push(c.sel);render(true)});
 document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{S.adds.splice(+b.dataset.rm,1);render(true)});}
function shopBox(m,dot6){const r=promoOf(m);if(!P)return '';if(!r)return `<div class="shop">매장 판촉표에 <b>${esc(m)}</b>가 없어요. 닷컴 요금 기준으로 보여 드려요.</div>`;
 const s=r['최종구독월'];return `<div class="shop"><div style="font-weight:700;margin-bottom:4px">매장 판촉가 · ${esc(m)}</div>
 ${r['체감가']?`일시불 체감가 <b>${won(r['체감가'])}원</b>${r['결제가']&&r['결제가']!==r['체감가']?` <span style="color:#888">(결제가 ${won(r['결제가'])})</span>`:''}<br>`:''}
 ${s?`구독 6년 월 <b>${won(s)}원</b>${r['구독할인']?` <span style="color:#888">(정상 ${won(r['구독월'])} − ${won(r['구독할인'])})</span>`:''}`:''}
 ${s&&dot6?`<br>같은 모델 닷컴 구독 월 ${won(dot6)}원 → ${dot6>s?'<b>매장이 월 '+won(dot6-s)+'원 · 6년 '+won((dot6-s)*72)+'원 유리</b>':dot6===s?'<b>요금은 같아요</b> · 매장 결합·묶음 혜택으로 차이를 만드세요':'매장이 월 '+won(s-dot6)+'원 높음'}`:''}
 ${r['비고']?`<div style="color:#888;font-size:12px;margin-top:4px">${esc(note(r['비고']))}</div>`:''}</div>`}
function brk(t,v){let a=0;for(const[m,p]of t||[])if(v>=m*1000)a=p*1000;return a}
function bundle(list){const gs=new Set(list.map(x=>x.g)),bind=list.length>=2&&gs.size>=2,keys=new Set(list.map(x=>LSPKEY[x.g]||x.g));let lsp=null;
 if(P&&P.rules&&P.rules['라스패'])for(const[n,rate,need]of P.rules['라스패']['패키지'])if(need.every(k=>keys.has(k))&&(!lsp||rate>lsp.rate||(rate===lsp.rate&&need.length>lsp.need.length)))lsp={n,rate,need};
 let month=0;const det=list.map(x=>{let v=x.sub;const b=bind?v-f100(v*0.95):0,l=lsp&&lsp.need.includes(LSPKEY[x.g]||x.g)?f100(v*lsp.rate/100):0;v-=b+l;month+=v;return Object.assign({},x,{dc:b+l,month:v})});
 const fit=list.some(x=>x.g==='냉장고'&&/^(D646|G646)/.test(x.m))&&list.some(x=>x.g==='김치냉장고'&&/^Z386/.test(x.m));
 const base=list.reduce((a,x)=>a+(x.list||0),0),pts=P&&P.rules?brk(P.rules['금액대포인트_총구매_11월17~30'],base)+brk(P.rules['금액대포인트_구독추가_11월17~30'],base):0;
 return {month,det,bind,lsp,fit,once:fit?300000:0,pts}}
const it=r=>({m:r['모델'],g:r.g,sub:r['최종구독월'],list:r['결제가']||0,row:r});
function lspHint(list){if(!P||!P.rules||!P.rules['라스패'])return [];const keys=new Set(list.map(x=>LSPKEY[x.g]||x.g)),o=[];
 for(const[n,rate,need]of P.rules['라스패']['패키지']){const miss=need.filter(k=>!keys.has(k));if(miss.length===1&&need.length-1<=keys.size)o.push(n+' '+rate+'%까지 '+miss[0]+' 1개')}return o.slice(0,3)}
function addBlock(c,m,dot6){if(!P)return '';const r=promoOf(m),g=r?r.g:(LSPKEY[c.name]?c.name:c.name);
 const base={m,g,sub:(r&&r['최종구독월'])||dot6||0,list:(r&&r['결제가'])||0};if(!base.sub)return '';
 const cur=[base].concat(S.adds.map(it)),now=bundle(cur),have=new Set(cur.map(x=>x.g)),by={};
 prow().forEach(z=>{if(!z['최종구독월']||isOff(z)||have.has(z.g)||['소형','밥솥','틔운','아이어닝','제습기'].includes(z.g))return;(by[z.g]=by[z.g]||[]).push(z)});
 const C=Object.entries(by).map(([gg,list])=>{list.sort((a,b)=>((b['구독할인']||0)-(a['구독할인']||0))||(a['최종구독월']-b['최종구독월']));
  const sel=(S.addSel[gg]&&list.find(z=>z['모델']===S.addSel[gg]))||(gg==='김치냉장고'&&cur.some(x=>/^(D646|G646)/.test(x.m))&&list.find(z=>/^Z386/.test(z['모델'])))||list[0];
  const nx=bundle(cur.concat([it(sel)]));return {g:gg,list,sel,real:nx.month-now.month,once:nx.once-now.once,lsp:nx.lsp&&(!now.lsp||nx.lsp.n!==now.lsp.n)?nx.lsp:null}})
  .sort((a,b)=>(b.once-a.once)||((ORDER.indexOf(a.g)+1||99)-(ORDER.indexOf(b.g)+1||99))||(a.real-b.real));window.__cands=C;const hint=lspHint(cur);
 let h=`<div class="sec"><div class="st2">하나 더 담으면 얼마? <span style="font-size:11px;font-weight:400;color:#888">같이 구독하면 결합 5% · 실제 더 내는 월 금액</span></div>`;
 h+=S.adds.map((a,i)=>`<div class="add in"><b>${esc(a.g)} · ${esc(a['모델'])}</b> <button class="ab" style="float:right" data-rm="${i}">빼기</button></div>`).join('');
 if(hint.length)h+=`<div class="note">라스패: ${esc(hint.join(' / '))}</div>`;
 h+=C.map(x=>`<div class="add"><b>+ ${esc(x.g)}</b>${x.once?'<span class="pl">Fit&Max 30만</span>':''}${x.lsp?`<span class="pl">라스패 ${x.lsp.rate}%</span>`:''}${['식기세척기','스타일러','전기레인지'].includes(x.g)?'<span class="pl g">M&B</span>':''}
  <select data-g="${esc(x.g)}">${x.list.map(z=>`<option value="${esc(z['모델'])}" ${z===x.sel?'selected':''}>${esc(z['모델'])} · 월 ${won(z['최종구독월'])}</option>`).join('')}</select>
  <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px"><span style="color:#888">월 ${won(x.sel['최종구독월'])}${x.real<x.sel['최종구독월']?' − 할인 '+won(x.sel['최종구독월']-x.real):''}${x.once?' · 동시 구독 30만':''}</span><b style="color:#A50034">실제 월 +${won(x.real)}원</b></div>
  <div style="text-align:right;margin-top:6px"><button class="ab" data-add="${esc(x.g)}">담기</button></div></div>`).join('');
 if(S.adds.length){h+=`<table><tr><th>제품</th><th>판촉 월</th><th>할인</th><th>월</th></tr>${now.det.map(d=>`<tr><td class="k">${esc(d.g)}<br><span style="font-size:11px;color:#888">${esc(d.m)}</span></td><td>${won(d.sub)}</td><td>${d.dc?'-'+won(d.dc):'-'}</td><td><b>${won(d.month)}</b></td></tr>`).join('')}</table>
  <div class="foot" style="padding:6px 0 0">${now.bind?'결합 5% ':''}${now.lsp?'· 라스패 '+esc(now.lsp.n)+' '+now.lsp.rate+'% ':''}${now.fit?'· Fit&Max 동시 구독 30만 ':''}${now.pts?'· 금액대 포인트 '+won(now.pts)+'P(참고)':''} · 6년 총 ${won(now.month*72)}원 · 고객맞춤플래너 결과와 한 번 맞춰 보세요</div>`}
 h+=`</div>`+(S.adds.length?`<div class="tot"><span>${cur.length}개 구독 · 월</span><b>${won(now.month)}원</b></div>`:'');return h}
